[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="lewspew-crypt"
version="1.1.0"
description="Deterministic audio analysis, compilation, FSQ codec and Voodoo Water DSP core"
requires-python=">=3.10"
dependencies=["numpy>=1.24"]
[project.optional-dependencies]
ml=["torch>=2.1","triton>=2.1"]
test=["pytest>=7"]
[project.scripts]
lewspew-crypt="lewspew_crypt.cli:main"
